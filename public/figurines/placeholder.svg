<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#1A1A1A" rx="8"/>
  <!-- Silhouette de figurine stylisée -->
  <!-- Corps -->
  <rect x="38" y="45" width="24" height="28" fill="#3A3A3A" rx="3"/>
  <!-- Tête -->
  <circle cx="50" cy="35" r="10" fill="#3A3A3A"/>
  <!-- Bras gauche -->
  <rect x="22" y="46" width="16" height="8" fill="#3A3A3A" rx="3" transform="rotate(-20 30 50)"/>
  <!-- Bras droit -->
  <rect x="62" y="46" width="16" height="8" fill="#3A3A3A" rx="3" transform="rotate(20 70 50)"/>
  <!-- Jambe gauche -->
  <rect x="36" y="70" width="10" height="16" fill="#3A3A3A" rx="2" transform="rotate(-5 41 78)"/>
  <!-- Jambe droite -->
  <rect x="54" y="70" width="10" height="16" fill="#3A3A3A" rx="2" transform="rotate(5 59 78)"/>
  <!-- Épée -->
  <rect x="68" y="30" width="4" height="30" fill="#C9A227" rx="2" transform="rotate(30 70 45)"/>
  <!-- Bouclier -->
  <ellipse cx="26" cy="52" rx="8" ry="10" fill="#C9A227" opacity="0.6"/>
</svg>
